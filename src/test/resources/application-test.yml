spring:
  datasource:
    url: jdbc:mysql://localhost:3306/becho_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&maxAllowedPacket=67108864
    username: becho_app
    password: becho_app_pw
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      repositories:
        enabled: false

becho:
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long-for-tests
    access-ttl-minutes: 15
    refresh-ttl-days: 7
